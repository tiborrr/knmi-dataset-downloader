name: Create GitHub release from tag

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release from pushed tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
